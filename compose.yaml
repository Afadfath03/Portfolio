services:
  backend:
    build: ./backend
    ports:
      - "8889:8889"
    env_file: .env
    volumes:
      - ./data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "8888:3000"
    env_file: .env
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8889
