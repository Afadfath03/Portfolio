name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    if: false # disabled — keep file for reference
    runs-on: ubuntu-latest
    steps:
      - name: SSH & deploy
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VPS_USER }}/project/Portfolio
            git pull origin main
